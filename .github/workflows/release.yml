name: Release Build APK & Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (apk / bundle / all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk
          - bundle

permissions:
  contents: write

jobs:
  release-build:
    name: Build Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # If upload key not configured, reuse debug keystore so release build doesn't fail
          if [ ! -f "${HOME}/upload-keystore.jks" ]; then
            export KEYSTORE_PATH="$(pwd)/debug.keystore"
            export STORE_PASSWORD="android"
            export KEY_PASSWORD="android"
          fi

          chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug

      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleDebug

      - name: Upload APK & Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tilawa-Release-Packages
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
          if-no-files-found: warn
          retention-days: 30
